<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <title>Shop Simulator 3D</title>
    <meta
      name="description"
      content="First-person shop simulator with day cycle, queue, checkout, and store expansion."
    />
  </head>
  <body>
    <div id="app">
      <div id="hud">
        <div id="topbar">
          <span id="money">$0</span>
          <span id="day">Day 1</span>
          <span id="storeLevel">Store LVL 1</span>
        </div>

        <div id="orderPanel">
          <h3>Customer Order</h3>
          <ul id="orderList"></ul>
        </div>

        <div id="cartPanel">
          <h3>Cart</h3>
          <ul id="cartList"></ul>
        </div>

        <div id="actions">
          <button id="qualityButton">Quality: Medium</button>
          <button id="upgradeButton">Expand Store</button>
          <button id="dayButton">Next Day</button>
        </div>
      </div>

      <div id="messageBox">Click to start. Move with WASD, mouse to look, E to interact.</div>

      <div id="touchControls">
        <div id="leftStick" class="stick">
          <div id="leftKnob" class="knob"></div>
        </div>
        <div id="rightButtons">
          <button id="interactBtn">E</button>
          <button id="scanBtn">SCAN</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
